name: Build Karavali App

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:

  # ── JOB 1: Lint ──────────────────────────────────────────────────────────
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Run lint
        run: |
          flake8 KARAVALI.py --max-line-length=120 --ignore=E501,W503 || true


  # ── JOB 2: Test + Coverage ───────────────────────────────────────────────
  test:
    name: Run Tests & Upload Coverage
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest -v \
            --cov=KARAVALI \
            --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unittests
          name: karavali-coverage
          fail_ci_if_error: false
          verbose: true


  # ── JOB 4: Build Linux Binary ─────────────────────────────────────────────
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install Python dependencies
        run: |
          pip install matplotlib numpy pyinstaller

      - name: Verify files exist
        run: |
          ls -la
          test -f KARAVALI.py && echo "KARAVALI.py FOUND" || (echo "KARAVALI.py NOT FOUND" && exit 1)
          test -f icon.png && echo "icon.png FOUND" || (echo "icon.png NOT FOUND" && exit 1)

      - name: Build binary with PyInstaller
        run: |
          pyinstaller --onefile --name "KaravaliApp" --icon=icon.png KARAVALI.py

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: KaravaliApp-Linux
          path: dist/KaravaliApp


  # ── JOB 5: Build Windows Binary ───────────────────────────────────────────
  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install matplotlib numpy pyinstaller

      - name: Verify files exist
        shell: pwsh
        run: |
          Get-ChildItem -Force
          if (!(Test-Path "KARAVALI.py")) { Write-Error "KARAVALI.py NOT FOUND"; exit 1 } else { Write-Output "KARAVALI.py FOUND" }
          if (!(Test-Path "icon.png")) { Write-Error "icon.png NOT FOUND"; exit 1 } else { Write-Output "icon.png FOUND" }

      - name: Build binary with PyInstaller
        run: |
          pyinstaller --onefile --name "KaravaliApp" --icon=icon.png KARAVALI.py

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: KaravaliApp-Windows
          path: dist/KaravaliApp.exe


  # ── JOB 6: Release (only on version tags) ────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ build-windows, build-linux ]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: KaravaliApp-Windows
          path: windows-build

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: KaravaliApp-Linux
          path: linux-build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-build/KaravaliApp.exe
            linux-build/KaravaliApp
          body: |
            ## Karavali Financial Management System

            ### Downloads
            - **Windows** → `KaravaliApp.exe`
            - **Linux** → `KaravaliApp`

            ### How to use
            Download the file for your OS and run it directly. No Python needed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}