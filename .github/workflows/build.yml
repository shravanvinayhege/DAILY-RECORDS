name: Build Karavali App

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'           # triggers on tags like v1.0, v1.2 etc
  pull_request:
    branches: [ main ]

jobs:

  # ── JOB 1: Lint check (runs on every push) ──────────────────────────────
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Run lint
        run: |
          flake8 main.py --max-line-length=120 --ignore=E501,W503 || true


  # ── JOB 2: Build Windows .exe ───────────────────────────────────────────
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "KaravaliApp" --icon=icon.png main.py
        # If you don't have icon.png, remove --icon=icon.png

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaravaliApp-Windows
          path: dist/KaravaliApp.exe


  # ── JOB 3: Build Linux binary ───────────────────────────────────────────
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
            pip install pyinstaller

      - name: Build binary with PyInstaller
        run: |
          pyinstaller --onefile --name "KaravaliApp" main.py

      - name: Upload Linux binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaravaliApp-Linux
          path: dist/KaravaliApp


  # ── JOB 4: Auto-release when you push a version tag ─────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ build-windows, build-linux ]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: KaravaliApp-Windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: KaravaliApp-Linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KaravaliApp.exe
            KaravaliApp
          body: |
            ## Karavali Financial Management System
            ### What's in this release
            - Windows executable (.exe)
            - Linux binary
            
            ### How to use
            Download the file for your OS and run it directly. No Python needed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}